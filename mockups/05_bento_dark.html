<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>퇴근후해결템 — 다크 벤토 카탈로그</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap">
<style>
:root{--bg:#121214;--bg2:#1C1C20;--line:#2C2C32;--fg:#FAFAF8;--mute:#A6A6AC;--tile:#FAFAF8;--ink:#121214;--ink2:#5C5C63;--accent:#FF7A1A;--num:'Outfit',Pretendard,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-top:20px}
.logo{width:40px;height:40px;border-radius:50%;flex:none;background:conic-gradient(from 200deg,var(--accent),#FFB36B 40%,#2C2C32 41%,#2C2C32);box-shadow:inset 0 0 0 2px var(--bg),0 0 0 1px var(--line)}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.2}
.handle{color:var(--mute);font-size:12px;font-family:var(--num)}
.hero{padding:44px 0 22px}
h1{font-size:clamp(34px,7.5vw,72px);line-height:1.04;letter-spacing:-.035em;font-weight:800}
h1 em{font-style:normal;color:var(--accent)}
.tagline{margin-top:14px;color:var(--mute);max-width:560px}
.disc{margin-top:18px;font-size:12px;line-height:1.45;color:var(--mute);border-left:2px solid var(--accent);padding-left:10px}

/* toolbar */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 14px}
.search{position:relative;display:block}
.search input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);padding:0 44px 0 16px;font-size:16px;outline:none;-webkit-appearance:none}
.search input::placeholder{color:#76767E}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.25)}
.search svg{position:absolute;right:16px;top:16px;width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}
.seg{display:flex;gap:4px;margin-top:10px;padding:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:36px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:var(--mute);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--tile);color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* grid */
.meta{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px 10px;font-size:13px;color:var(--mute)}
.meta b{font-family:var(--num);color:var(--fg);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{position:relative;display:flex;flex-direction:column;background:var(--tile);color:var(--ink);border-radius:14px;overflow:hidden;isolation:isolate;transition:transform .35s ease,box-shadow .35s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.5)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wm{position:absolute;right:-6px;bottom:-.18em;z-index:0;font-family:var(--num);font-weight:800;font-size:clamp(84px,30vw,150px);line-height:1;letter-spacing:-.05em;color:rgba(18,18,20,.055);pointer-events:none;user-select:none}
.media{position:relative;z-index:1;aspect-ratio:1;padding:14px;display:grid;place-items:center;overflow:hidden}
.media img{width:100%;height:100%;object-fit:contain;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .media img{transform:scale(1.06)}
.media.noimg::after{content:'이미지 준비중';width:70%;aspect-ratio:1;display:grid;place-items:center;font-size:12px;color:var(--ink2);border:1px dashed #CDCDC8;border-radius:10px}
.num{position:absolute;left:10px;top:10px;z-index:2;font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.02em;background:var(--ink);color:var(--fg);padding:3px 8px;border-radius:999px}
.badges{position:absolute;right:10px;top:10px;z-index:2;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.b{font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;line-height:1.3}
.b-best{background:var(--accent);color:var(--ink)}
.b-sale{background:#FFF;border:1.5px solid var(--accent);color:#A64400}
.b-out{background:#5C5C63;color:#FFF}
.info{position:relative;z-index:1;padding:2px 14px 14px}
.name{font-size:14px;font-weight:600;line-height:1.35;min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{margin-top:8px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price b{font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price s{color:var(--ink2);font-size:12px}
.pct{font-family:var(--num);font-weight:800;font-size:12px;background:var(--accent);color:var(--ink);padding:1px 6px;border-radius:6px}
.card.out{opacity:.6}
.card.out .media img{filter:grayscale(1)}
.empty{grid-column:1/-1;padding:60px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}

@media(min-width:768px){
 .grid{grid-template-columns:repeat(3,1fr)}
 .bento .card:first-child{grid-column:span 2;grid-row:span 2}
 .bento .card:first-child .media{aspect-ratio:auto;flex:1;min-height:0;padding:28px}
 .bento .card:first-child .name{font-size:18px}
 .bento .card:first-child .price b{font-size:24px}
}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}

/* footer */
footer{margin-top:64px;padding:28px 0 48px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
footer p+p{margin-top:8px}
footer a{color:var(--fg);border-bottom:1px solid var(--accent)}
</style>
</head>
<body>
<main class="wrap">
<header>
 <div class="top">
  <div class="logo" aria-hidden="true"></div>
  <div><div class="brand" id="brand"></div><div class="handle" id="handle"></div></div>
 </div>
 <div class="hero">
  <h1>퇴근하고 또 집안일?<br>그건 <em>템</em>이 합니다.</h1>
  <p class="tagline" id="tag"></p>
  <p class="disc" id="disc"></p>
 </div>
</header>

<div class="bar">
 <label class="search"><span class="sr">상품 검색</span>
  <input id="q" type="search" placeholder="번호(#003) 또는 상품명 검색" autocomplete="off">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
 </label>
 <div class="seg" id="seg" aria-label="필터"></div>
</div>

<div class="meta"><span><b id="cnt">0</b>개의 해결템</span><span>최신순</span></div>
<section class="grid" id="grid" aria-live="polite"></section>

<footer>
 <p id="note"></p>
 <p>문의 <a id="mail"></a> · <a id="ig" target="_blank" rel="noopener"></a></p>
 <p>© 2026 <span id="brand2"></span></p>
</footer>
</main>

<script id="data" type="application/json">
{"brand":{"name":"퇴근후해결템","handle":"after6_fix","tagline":"퇴근하고 집 오면 또 집안일… 그거 해결해주는 템만 골라요","instagram":"https://www.instagram.com/after6_fix/","contact":"after6fix@gmail.com","disclosure":"이 페이지의 링크는 쿠팡 파트너스 활동의 일환으로, 구매 시 일정액의 수수료를 제공받습니다.","price_note":"가격·할인은 쿠팡 기준이며 변동될 수 있습니다."},
"categories":["주방","수납","욕실","청소","기타"],
"products":[
{"id":6,"name":"무선 핸디 청소기 미니","category":"청소","price":39900,"orig_price":59000,"image":"img/p6.webp","coupang_url":"https://link.coupang.com/a/example6","reel_url":"https://www.instagram.com/reel/x6/","best":false,"sale":true,"soldout":false,"added":"2026-10-01","active":true},
{"id":5,"name":"욕실 벽걸이 온풍기 (환풍 겸용)","category":"욕실","price":129000,"orig_price":129000,"image":"img/p5.webp","coupang_url":"https://link.coupang.com/a/example5","reel_url":"https://www.instagram.com/reel/x5/","best":true,"sale":false,"soldout":false,"added":"2026-09-30","active":true},
{"id":4,"name":"냉장고 계란 정리 트레이 투명","category":"수납","price":8900,"orig_price":12900,"image":"img/p4.webp","coupang_url":"https://link.coupang.com/a/example4","reel_url":"https://www.instagram.com/reel/x4/","best":false,"sale":true,"soldout":false,"added":"2026-09-29","active":true},
{"id":3,"name":"독일식 다기능 채칼 세트","category":"주방","price":15900,"orig_price":15900,"image":"img/p3.webp","coupang_url":"https://link.coupang.com/a/example3","reel_url":"https://www.instagram.com/reel/x3/","best":true,"sale":false,"soldout":true,"added":"2026-09-28","active":true},
{"id":2,"name":"슬라이딩 숨김 수납함 2단 화이트","category":"수납","price":24900,"orig_price":32000,"image":"img/p2.webp","coupang_url":"https://link.coupang.com/a/example2","reel_url":"https://www.instagram.com/reel/x2/","best":true,"sale":true,"soldout":false,"added":"2026-09-27","active":true},
{"id":1,"name":"실리콘 가스레인지 커버 (기름 튐 방지)","category":"주방","price":12900,"orig_price":12900,"image":"img/p1.webp","coupang_url":"https://link.coupang.com/a/example1","reel_url":"https://www.instagram.com/reel/x1/","best":false,"sale":false,"soldout":false,"added":"2026-09-26","active":true}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>n.toLocaleString('ko-KR')+'원';
const pad=n=>'#'+String(n).padStart(3,'0');

$('#brand').textContent=$('#brand2').textContent=D.brand.name;
$('#handle').textContent='@'+D.brand.handle;
$('#tag').textContent=D.brand.tagline;
$('#disc').textContent=D.brand.disclosure;
$('#note').textContent=D.brand.price_note;
$('#mail').textContent=D.brand.contact;$('#mail').href='mailto:'+D.brand.contact;
$('#ig').textContent='인스타그램 @'+D.brand.handle;$('#ig').href=D.brand.instagram;

const items=D.products.filter(p=>p.active!==false).sort((a,b)=>b.added.localeCompare(a.added)||b.id-a.id);
const segs=[['all','전체'],['best','베스트'],['sale','할인중'],...D.categories.map(c=>[c,c])];
let seg='all',q='';

$('#seg').innerHTML=segs.map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k==='all'}">${l}</button>`).join('');
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;seg=b.dataset.k;for(const x of $('#seg').children)x.setAttribute('aria-pressed',x===b);render()};
$('#q').oninput=e=>{q=e.target.value.trim();render()};

function card(p){
 const pct=p.sale&&p.orig_price>p.price?Math.round((1-p.price/p.orig_price)*100):0;
 return `<a class="card${p.soldout?' out':''}" href="${esc(p.coupang_url)}" target="_blank" rel="noopener sponsored" aria-label="${pad(p.id)} ${esc(p.name)} ${won(p.price)}${p.soldout?' 품절':''}">
  <span class="wm" aria-hidden="true">${pad(p.id)}</span>
  <span class="num">${pad(p.id)}</span>
  <span class="badges">${p.best?'<span class="b b-best">베스트</span>':''}${pct?'<span class="b b-sale">할인중</span>':''}${p.soldout?'<span class="b b-out">품절</span>':''}</span>
  <div class="media"><img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('noimg');this.remove()"></div>
  <div class="info">
   <div class="name">${esc(p.name)}</div>
   <div class="price"><b>${won(p.price)}</b>${pct?`<s>${won(p.orig_price)}</s><span class="pct">${pct}%</span>`:''}</div>
  </div>
 </a>`;
}

function render(){
 const n=q.replace(/^#/,'');const num=/^\d+$/.test(n)?+n:null;const ql=q.toLowerCase();
 const list=items.filter(p=>
  (seg==='all'||(seg==='best'&&p.best)||(seg==='sale'&&p.sale)||p.category===seg)&&
  (!q||(num!==null&&p.id===num)||p.name.toLowerCase().includes(ql)));
 $('#cnt').textContent=list.length;
 const g=$('#grid');
 g.classList.toggle('bento',seg==='all'&&!q&&list.length>=5);
 g.innerHTML=list.length?list.map(card).join(''):'<div class="empty">조건에 맞는 해결템이 없어요.<br>다른 번호나 이름으로 찾아보세요.</div>';
}
render();
</script>
</body>
</html>
