<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퇴근후해결템 — 소개한 제품 모아보기</title>
<meta name="description" content="퇴근후해결템 릴스에서 소개한 제품 링크 모음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#FFFFFF;
  --ink:#111111;
  --muted:#787774;
  --faint:#A8A6A1;
  --line:#EAEAEA;
  --surface:#F9F9F8;
  --accent:#FF6A00;
  --red:#C0392B;
  --tag-yellow:#FBF3DB; --tag-yellow-ink:#956400;
  --tag-red:#FDEBEC;    --tag-red-ink:#9F2F2D;
  --tag-grey:#F1F0EE;   --tag-grey-ink:#6B6966;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Pretendard","Pretendard Variable","SF Pro Display","Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
.hdr{padding:40px 0 28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:40px;height:40px;border-radius:50%;flex:none;
  border:1px solid var(--line);background:var(--bg);
  display:grid;place-items:center;
}
.logo svg{width:20px;height:20px;display:block}
.brand-name{font-size:17px;font-weight:700;letter-spacing:-0.02em;line-height:1.2}
.brand-handle{font-size:12px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.tagline{margin-top:18px;font-size:15px;color:var(--ink);line-height:1.55;max-width:560px}
.disclosure{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5;max-width:560px}

/* ---------- controls ---------- */
.controls{padding:24px 0 8px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none}
.search input{
  width:100%;height:44px;padding:0 40px 0 38px;
  border:1px solid var(--line);border-radius:8px;background:var(--bg);
  outline:none;transition:border-color .2s;
}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--ink)}
.search .clear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border:0;background:none;border-radius:6px;
  color:var(--faint);cursor:pointer;display:none;place-items:center;
}
.search .clear svg{position:static;transform:none;width:14px;height:14px;color:inherit}
.search.has-q .clear{display:grid}
.search .clear:hover{color:var(--ink);background:var(--surface)}

.chips{
  display:flex;gap:8px;margin-top:16px;overflow-x:auto;
  padding-bottom:4px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:34px;padding:0 14px;border-radius:9999px;
  border:1px solid var(--line);background:var(--bg);color:var(--muted);
  font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:color .2s,background .2s,border-color .2s,transform .1s;
}
.chip:hover{color:var(--ink);border-color:#D6D4CF}
.chip:active{transform:scale(.98)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.meta{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:20px 0 12px;font-size:12px;color:var(--muted);
}
.meta b{color:var(--ink);font-weight:600}

/* ---------- grid ---------- */
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:28px 16px;padding:4px 0 56px;
}
@media (min-width:768px){.grid{grid-template-columns:repeat(3,1fr);gap:36px 24px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,1fr);gap:44px 28px}}

.card{
  display:block;position:relative;border-radius:8px;
  animation:rise .6s cubic-bezier(.16,1,.3,1) both;
  animation-delay:calc(var(--i,0) * 60ms);
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

.thumb{
  position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;
  border:1px solid var(--line);background:var(--bg);
  transition:box-shadow .2s,border-color .2s;
}
.card:hover .thumb{box-shadow:0 1px 4px rgba(0,0,0,.05);border-color:#DEDCD7}
.thumb img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;padding:10%;display:block;
  transition:transform .4s cubic-bezier(.16,1,.3,1);
}
.card:hover .thumb img{transform:scale(1.03)}
.thumb .ph{
  position:absolute;inset:0;display:none;place-items:center;
  background:var(--surface);color:var(--faint);
}
.thumb .ph svg{width:28px;height:28px}
.thumb.no-img img{display:none}
.thumb.no-img .ph{display:grid}

.num{
  position:absolute;top:10px;left:10px;z-index:1;
  font-family:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  font-size:11px;letter-spacing:.04em;line-height:1;
  padding:5px 7px;border-radius:4px;
  background:var(--bg);border:1px solid var(--line);color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.badges{position:absolute;top:10px;right:10px;z-index:1;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tag{
  font-size:10px;font-weight:600;letter-spacing:.05em;line-height:1;
  padding:5px 8px;border-radius:9999px;white-space:nowrap;
}
.tag.best{background:var(--tag-yellow);color:var(--tag-yellow-ink)}
.tag.sale{background:var(--tag-red);color:var(--tag-red-ink)}
.tag.sold{background:var(--tag-grey);color:var(--tag-grey-ink)}

.body{padding:12px 2px 0}
.cat{font-size:11px;color:var(--faint);letter-spacing:.02em;margin-bottom:4px}
.name{
  font-size:14px;font-weight:500;line-height:1.45;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:calc(14px * 1.45 * 2);
}
.price{margin-top:8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.price .now{font-size:16px;font-weight:700;letter-spacing:-0.01em}
.price .was{font-size:12px;color:var(--faint);text-decoration:line-through}
.price .off{font-size:13px;font-weight:700;color:var(--red)}

.card.soldout .thumb,.card.soldout .body{opacity:.45}
.card.soldout .badges .sold{opacity:1}

.empty{
  grid-column:1/-1;text-align:center;padding:72px 0;
  color:var(--muted);font-size:14px;line-height:1.7;
}
.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* ---------- footer ---------- */
.ftr{border-top:1px solid var(--line);padding:32px 0 56px;font-size:12px;color:var(--muted);line-height:1.8}
.ftr p+p{margin-top:2px}
.ftr a{border-bottom:1px solid var(--line);transition:border-color .2s,color .2s}
.ftr a:hover{color:var(--accent);border-color:var(--accent)}
.ftr .links{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.ftr .copy{margin-top:22px;color:var(--faint)}
</style>
</head>
<body>

<script id="data" type="application/json">
{
 "brand": {"name": "퇴근후해결템", "handle": "after6_fix", "tagline": "퇴근하고 집 오면 또 집안일… 그거 해결해주는 템만 골라요", "instagram": "https://www.instagram.com/after6_fix/", "contact": "after6fix@gmail.com",
  "disclosure": "이 페이지의 링크는 쿠팡 파트너스 활동의 일환으로, 구매 시 일정액의 수수료를 제공받습니다.",
  "price_note": "가격·할인은 쿠팡 기준이며 변동될 수 있습니다."},
 "categories": ["주방", "수납", "욕실", "청소", "기타"],
 "products": [
  {"id": 6, "name": "무선 핸디 청소기 미니", "category": "청소", "price": 39900, "orig_price": 59000, "image": "img/p6.webp", "coupang_url": "https://link.coupang.com/a/example6", "reel_url": "https://www.instagram.com/reel/x6/", "best": false, "sale": true, "soldout": false, "added": "2026-10-01", "active": true},
  {"id": 5, "name": "욕실 벽걸이 온풍기 (환풍 겸용)", "category": "욕실", "price": 129000, "orig_price": 129000, "image": "img/p5.webp", "coupang_url": "https://link.coupang.com/a/example5", "reel_url": "https://www.instagram.com/reel/x5/", "best": true, "sale": false, "soldout": false, "added": "2026-09-30", "active": true},
  {"id": 4, "name": "냉장고 계란 정리 트레이 투명", "category": "수납", "price": 8900, "orig_price": 12900, "image": "img/p4.webp", "coupang_url": "https://link.coupang.com/a/example4", "reel_url": "https://www.instagram.com/reel/x4/", "best": false, "sale": true, "soldout": false, "added": "2026-09-29", "active": true},
  {"id": 3, "name": "독일식 다기능 채칼 세트", "category": "주방", "price": 15900, "orig_price": 15900, "image": "img/p3.webp", "coupang_url": "https://link.coupang.com/a/example3", "reel_url": "https://www.instagram.com/reel/x3/", "best": true, "sale": false, "soldout": true, "added": "2026-09-28", "active": true},
  {"id": 2, "name": "슬라이딩 숨김 수납함 2단 화이트", "category": "수납", "price": 24900, "orig_price": 32000, "image": "img/p2.webp", "coupang_url": "https://link.coupang.com/a/example2", "reel_url": "https://www.instagram.com/reel/x2/", "best": true, "sale": true, "soldout": false, "added": "2026-09-27", "active": true},
  {"id": 1, "name": "실리콘 가스레인지 커버 (기름 튐 방지)", "category": "주방", "price": 12900, "orig_price": 12900, "image": "img/p1.webp", "coupang_url": "https://link.coupang.com/a/example1", "reel_url": "https://www.instagram.com/reel/x1/", "best": false, "sale": false, "soldout": false, "added": "2026-09-26", "active": true}
 ]
}
</script>

<header class="hdr">
  <div class="wrap">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FF6A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5 12 4l9 7.5"/>
          <path d="M5.5 10v9.5h13V10"/>
          <path d="M10 19.5v-5h4v5"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-name" id="brandName"></h1>
        <div class="brand-handle" id="brandHandle"></div>
      </div>
    </div>
    <p class="tagline" id="tagline"></p>
    <p class="disclosure" id="disclosure"></p>
  </div>
</header>

<main class="wrap">
  <section class="controls" aria-label="검색 및 필터">
    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="번호(#003) 또는 제품명으로 찾기" aria-label="제품 검색">
      <button class="clear" id="clearBtn" type="button" aria-label="검색어 지우기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="분류"></div>
  </section>

  <div class="meta"><span><b id="count">0</b>개 제품</span><span>최근 소개 순</span></div>

  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<footer class="ftr">
  <div class="wrap">
    <p id="priceNote"></p>
    <p id="disclosure2"></p>
    <div class="links">
      <a id="igLink" href="#" target="_blank" rel="noopener">인스타그램</a>
      <a id="mailLink" href="#">문의하기</a>
    </div>
    <p class="copy" id="copy"></p>
  </div>
</footer>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var brand = DATA.brand;
  var $ = function(id){ return document.getElementById(id); };

  // brand text
  $('brandName').textContent = brand.name;
  $('brandHandle').textContent = '@' + brand.handle;
  $('tagline').textContent = brand.tagline;
  $('disclosure').textContent = brand.disclosure;
  $('priceNote').textContent = brand.price_note;
  $('disclosure2').textContent = brand.disclosure;
  $('igLink').href = brand.instagram;
  $('mailLink').href = 'mailto:' + brand.contact;
  $('mailLink').textContent = brand.contact;
  $('copy').textContent = '© ' + new Date().getFullYear() + ' ' + brand.name;

  // products: active only, newest first by added then id desc
  var products = DATA.products.filter(function(p){ return p.active !== false; })
    .sort(function(a,b){
      if (a.added !== b.added) return a.added < b.added ? 1 : -1;
      return b.id - a.id;
    });

  var state = { q: '', tab: 'all' };

  // chips
  var tabs = [['all','전체'],['best','베스트'],['sale','할인중']]
    .concat(DATA.categories.map(function(c){ return ['cat:' + c, c]; }));
  var chipsEl = $('chips');
  tabs.forEach(function(t){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = t[1];
    b.dataset.tab = t[0];
    b.setAttribute('aria-pressed', t[0] === state.tab ? 'true' : 'false');
    b.addEventListener('click', function(){
      state.tab = t[0];
      chipsEl.querySelectorAll('.chip').forEach(function(c){
        c.setAttribute('aria-pressed', c.dataset.tab === state.tab ? 'true' : 'false');
      });
      render();
    });
    chipsEl.appendChild(b);
  });

  // search
  var qEl = $('q'), box = $('searchBox');
  qEl.addEventListener('input', function(){
    state.q = qEl.value;
    box.classList.toggle('has-q', state.q.length > 0);
    render();
  });
  $('clearBtn').addEventListener('click', function(){
    qEl.value = ''; state.q = ''; box.classList.remove('has-q'); render(); qEl.focus();
  });

  function pad(n){ return '#' + String(n).padStart(3, '0'); }
  function won(n){ return n.toLocaleString('ko-KR') + '원'; }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function matches(p){
    var q = state.q.trim().toLowerCase();
    if (q) {
      var num = q.replace(/^#/, '');
      if (/^\d+$/.test(num)) {
        if (parseInt(num, 10) !== p.id) return false;
      } else if (p.name.toLowerCase().indexOf(q) < 0) {
        return false;
      }
    }
    if (state.tab === 'best') return !!p.best;
    if (state.tab === 'sale') return !!p.sale && p.orig_price > p.price;
    if (state.tab.indexOf('cat:') === 0) return p.category === state.tab.slice(4);
    return true;
  }

  var PH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m4 16 4-4 4 4 3-3 5 5"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>';

  function card(p, i){
    var onSale = p.sale && p.orig_price > p.price;
    var off = onSale ? Math.round((1 - p.price / p.orig_price) * 100) : 0;
    var badges = '';
    if (p.best) badges += '<span class="tag best">베스트</span>';
    if (onSale) badges += '<span class="tag sale">할인중</span>';
    if (p.soldout) badges += '<span class="tag sold">품절</span>';
    var price = '<span class="now">' + won(p.price) + '</span>';
    if (onSale) price += '<span class="was">' + won(p.orig_price) + '</span><span class="off">' + off + '%</span>';
    return '<a class="card' + (p.soldout ? ' soldout' : '') + '" style="--i:' + i + '" href="' + esc(p.coupang_url) + '" target="_blank" rel="noopener sponsored" aria-label="' + esc(pad(p.id) + ' ' + p.name + ', ' + won(p.price) + (p.soldout ? ', 품절' : '')) + '">' +
      '<div class="thumb">' +
        '<span class="num">' + pad(p.id) + '</span>' +
        (badges ? '<div class="badges">' + badges + '</div>' : '') +
        '<img src="' + esc(p.image) + '" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.add(\'no-img\')">' +
        '<div class="ph" aria-hidden="true">' + PH_SVG + '</div>' +
      '</div>' +
      '<div class="body">' +
        '<div class="cat">' + esc(p.category) + '</div>' +
        '<div class="name">' + esc(p.name) + '</div>' +
        '<div class="price">' + price + '</div>' +
      '</div>' +
    '</a>';
  }

  var grid = $('grid'), countEl = $('count');
  function render(){
    var list = products.filter(matches);
    countEl.textContent = list.length;
    if (!list.length) {
      grid.innerHTML = '<div class="empty"><strong>해당하는 제품이 없어요</strong>번호나 이름을 다시 확인해 주세요.</div>';
      return;
    }
    grid.innerHTML = list.map(card).join('');
  }
  render();
})();
</script>
</body>
</html>
