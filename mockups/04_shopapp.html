<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퇴근후해결템 - 영상 속 제품 모아보기</title>
<meta name="description" content="퇴근후해결템 릴스에 나온 제품을 번호로 바로 찾는 쿠팡 링크 모음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#F5F6F8; --card:#FFFFFF; --ink:#191C21; --ink-2:#4B5159; --ink-3:#7C8390;
    --line:#E6E8EC; --chip:#EEF0F3;
    --orange:#FF6A00; --red:#E5322D; --grey:#9AA0A8; --brand:#1F6FEB;
    --r:14px; --sh:0 1px 2px rgba(25,28,33,.04),0 4px 14px rgba(25,28,33,.06);
    --sh-hi:0 2px 4px rgba(25,28,33,.06),0 10px 24px rgba(25,28,33,.10);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.45;font-size:15px;
    word-break:keep-all;overflow-wrap:anywhere;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  img{display:block;max-width:100%}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- sticky top bar ---------- */
  .top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;gap:10px;height:60px}
  .logo{width:40px;height:40px;border-radius:50%;flex:none;background:linear-gradient(135deg,#FF8A3D,var(--orange));color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;letter-spacing:-.02em}
  .brand{font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
  .search{flex:1;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--chip);border-radius:999px;min-width:0}
  .search svg{flex:none;color:var(--ink-3)}
  .search input{flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none}
  .search input::placeholder{color:#6B727D}
  .search:focus-within{box-shadow:0 0 0 2px var(--orange) inset;background:#fff}
  .clear{display:none;width:22px;height:22px;border-radius:50%;background:#C9CED6;color:#fff;place-items:center;flex:none}
  .search.has .clear{display:grid}
  @media(max-width:479px){.top .brand{display:none}}

  /* ---------- intro ---------- */
  .intro{padding:18px 0 4px}
  .intro h1{font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.25}
  .intro p{margin-top:6px;color:var(--ink-2);font-size:14px;max-width:46ch}
  .disc{margin-top:10px;display:inline-flex;align-items:flex-start;gap:6px;padding:8px 10px;border-radius:10px;background:#FFF3EA;color:#8A3D00;font-size:12px;line-height:1.4}
  .disc svg{flex:none;margin-top:1px}

  /* ---------- chips ---------- */
  .chips{position:sticky;top:60px;z-index:9;background:var(--bg);padding:12px 0 10px}
  .chips .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px;margin:0 -16px;scroll-padding:16px}
  .chips .row::-webkit-scrollbar{display:none}
  .chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink-2);transition:transform .15s var(--ease),background .15s,color .15s}
  .chip:active{transform:scale(.96)}
  .chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .n{margin-left:4px;font-weight:500;opacity:.7;font-size:12px}
  .chip.best[aria-pressed=true]{background:var(--orange);border-color:var(--orange)}
  .chip.sale[aria-pressed=true]{background:var(--red);border-color:var(--red)}

  /* ---------- section head ---------- */
  .sec{padding-top:14px}
  .sec h2{font-size:17px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
  .sec h2 small{font-size:13px;font-weight:500;color:var(--ink-3)}

  /* ---------- recent strip ---------- */
  .recent{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:12px 16px 6px;margin:0 -16px}
  .recent::-webkit-scrollbar{display:none}
  .recent .card{flex:none;width:min(72vw,300px);scroll-snap-align:start}
  .recent .card .img{padding:18px}
  .recent .card .name{font-size:16px}
  .recent .card .price{font-size:19px}
  .recent .card .new{position:absolute;left:10px;top:10px}
  @media(min-width:768px){.recent{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin:0;padding:12px 0 6px}.recent .card{width:auto}}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 0 8px}
  @media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
  @media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}

  /* ---------- card ---------- */
  .card{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s var(--ease);-webkit-tap-highlight-color:transparent}
  .card:hover{transform:translateY(-2px);box-shadow:var(--sh-hi)}
  .card:active{transform:scale(.985)}
  .card:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .img{position:relative;aspect-ratio:1;padding:14px;background:#FAFBFC;display:grid;place-items:center}
  .img img{width:100%;height:100%;object-fit:contain}
  .img.noimg::before{content:attr(data-no);font-size:28px;font-weight:800;color:#C9CED6;letter-spacing:-.03em}
  .no{position:absolute;left:10px;top:10px;padding:3px 8px;border-radius:999px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .recent .no{left:auto;right:10px}
  .new{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px;font-weight:700}
  .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .tags{display:flex;gap:4px;flex-wrap:wrap;min-height:20px}
  .tag{height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;color:#fff;letter-spacing:.01em}
  .tag.best{background:var(--orange)}
  .tag.sale{background:var(--red)}
  .tag.out{background:var(--grey)}
  .name{font-size:14px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
  .pr{margin-top:auto;display:flex;flex-direction:column;gap:1px}
  .orig{font-size:12px;color:var(--ink-3);text-decoration:line-through}
  .price{display:flex;align-items:baseline;gap:6px;font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pct{color:var(--red);font-weight:800}
  .price .won{font-size:13px;font-weight:600;margin-left:-3px}
  .card.out .img img{opacity:.45;filter:grayscale(1)}
  .card.out .name,.card.out .price{color:var(--ink-3)}
  .card.out .pct{color:var(--ink-3)}

  /* ---------- empty ---------- */
  .empty{display:none;text-align:center;padding:48px 16px;color:var(--ink-2)}
  .empty.on{display:block}
  .empty strong{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
  .empty button{margin-top:14px;height:40px;padding:0 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700}

  /* ---------- footer ---------- */
  footer{margin-top:32px;padding:24px 0 calc(28px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink-2)}
  footer .wrap{display:flex;flex-direction:column;gap:8px}
  footer .links{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px}
  footer .links a{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
  footer .links a:hover{color:var(--orange)}
  footer .fine{font-size:12px;color:var(--ink-3)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="logo" aria-hidden="true">퇴근</div>
    <div class="brand" id="brandName"></div>
    <label class="search" id="searchBox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr">제품 번호나 이름으로 검색</span>
      <input id="q" type="search" placeholder="번호(#3) 또는 제품명 검색" autocomplete="off" enterkeyhint="search">
      <button type="button" class="clear" id="clear" aria-label="검색어 지우기">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </label>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <h1 id="tagline"></h1>
    <p>영상에 나온 번호를 검색창에 치면 바로 찾을 수 있어요.</p>
    <div class="disc" id="disclosure">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/></svg>
      <span></span>
    </div>
  </section>

  <nav class="chips" aria-label="카테고리 필터"><div class="row" id="chips"></div></nav>

  <section class="sec" id="recentSec">
    <h2>최근 영상 제품 <small>새로 올라온 3개</small></h2>
    <div class="recent" id="recent"></div>
  </section>

  <section class="sec">
    <h2 id="gridTitle">전체 제품 <small id="count"></small></h2>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">
      <strong>검색 결과가 없어요</strong>
      <span id="emptyMsg"></span><br>
      <button type="button" id="reset">전체 보기</button>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div id="priceNote"></div>
    <div class="links">
      <a id="igLink" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        <span id="igHandle"></span>
      </a>
      <a id="mail">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg>
        <span id="mailText"></span>
      </a>
    </div>
    <div class="fine" id="footDisc"></div>
  </div>
</footer>

<script id="data" type="application/json">
{
 "brand": {"name": "퇴근후해결템", "handle": "after6_fix", "tagline": "퇴근하고 집 오면 또 집안일… 그거 해결해주는 템만 골라요", "instagram": "https://www.instagram.com/after6_fix/", "contact": "after6fix@gmail.com",
  "disclosure": "이 페이지의 링크는 쿠팡 파트너스 활동의 일환으로, 구매 시 일정액의 수수료를 제공받습니다.",
  "price_note": "가격·할인은 쿠팡 기준이며 변동될 수 있습니다."},
 "categories": ["주방", "수납", "욕실", "청소", "기타"],
 "products": [
  {"id": 6, "name": "무선 핸디 청소기 미니", "category": "청소", "price": 39900, "orig_price": 59000, "image": "img/p6.webp", "coupang_url": "https://link.coupang.com/a/example6", "reel_url": "https://www.instagram.com/reel/x6/", "best": false, "sale": true, "soldout": false, "added": "2026-10-01", "active": true},
  {"id": 5, "name": "욕실 벽걸이 온풍기 (환풍 겸용)", "category": "욕실", "price": 129000, "orig_price": 129000, "image": "img/p5.webp", "coupang_url": "https://link.coupang.com/a/example5", "reel_url": "https://www.instagram.com/reel/x5/", "best": true, "sale": false, "soldout": false, "added": "2026-09-30", "active": true},
  {"id": 4, "name": "냉장고 계란 정리 트레이 투명", "category": "수납", "price": 8900, "orig_price": 12900, "image": "img/p4.webp", "coupang_url": "https://link.coupang.com/a/example4", "reel_url": "https://www.instagram.com/reel/x4/", "best": false, "sale": true, "soldout": false, "added": "2026-09-29", "active": true},
  {"id": 3, "name": "독일식 다기능 채칼 세트", "category": "주방", "price": 15900, "orig_price": 15900, "image": "img/p3.webp", "coupang_url": "https://link.coupang.com/a/example3", "reel_url": "https://www.instagram.com/reel/x3/", "best": true, "sale": false, "soldout": true, "added": "2026-09-28", "active": true},
  {"id": 2, "name": "슬라이딩 숨김 수납함 2단 화이트", "category": "수납", "price": 24900, "orig_price": 32000, "image": "img/p2.webp", "coupang_url": "https://link.coupang.com/a/example2", "reel_url": "https://www.instagram.com/reel/x2/", "best": true, "sale": true, "soldout": false, "added": "2026-09-27", "active": true},
  {"id": 1, "name": "실리콘 가스레인지 커버 (기름 튐 방지)", "category": "주방", "price": 12900, "orig_price": 12900, "image": "img/p1.webp", "coupang_url": "https://link.coupang.com/a/example1", "reel_url": "https://www.instagram.com/reel/x1/", "best": false, "sale": false, "soldout": false, "added": "2026-09-26", "active": true}
 ]
}
</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var won = function(n){ return n.toLocaleString('ko-KR'); };
  var pad = function(id){ return '#' + String(id).padStart(3, '0'); };

  // newest first: added desc, id desc
  var all = D.products.filter(function(p){ return p.active !== false; }).sort(function(a, b){
    return a.added === b.added ? b.id - a.id : (a.added < b.added ? 1 : -1);
  });

  // ---- brand text ----
  $('brandName').textContent = D.brand.name;
  $('tagline').textContent = D.brand.tagline;
  $('disclosure').lastElementChild.textContent = D.brand.disclosure;
  $('footDisc').textContent = D.brand.disclosure;
  $('priceNote').textContent = D.brand.price_note;
  $('igLink').href = D.brand.instagram;
  $('igHandle').textContent = '@' + D.brand.handle;
  $('mail').href = 'mailto:' + D.brand.contact;
  $('mailText').textContent = D.brand.contact;
  document.title = D.brand.name + ' - 영상 속 제품 모아보기';

  // ---- card ----
  function card(p, isNew){
    var sale = p.sale && p.orig_price > p.price;
    var pct = sale ? Math.round((1 - p.price / p.orig_price) * 100) : 0;
    var tags = '';
    if (p.best) tags += '<span class="tag best">베스트</span>';
    if (sale) tags += '<span class="tag sale">할인중</span>';
    if (p.soldout) tags += '<span class="tag out">품절</span>';
    return '<a class="card' + (p.soldout ? ' out' : '') + '" href="' + esc(p.coupang_url) + '" target="_blank" rel="noopener sponsored" aria-label="' + esc(pad(p.id) + ' ' + p.name + ' ' + won(p.price) + '원' + (p.soldout ? ' 품절' : '')) + '">'
      + '<div class="img" data-no="' + pad(p.id) + '">'
      + (isNew ? '<span class="new">NEW</span>' : '')
      + '<img src="' + esc(p.image) + '" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'noimg\');this.remove()">'
      + '<span class="no">' + pad(p.id) + '</span>'
      + '</div>'
      + '<div class="body">'
      + '<div class="tags">' + tags + '</div>'
      + '<div class="name">' + esc(p.name) + '</div>'
      + '<div class="pr">'
      + (sale ? '<span class="orig">' + won(p.orig_price) + '원</span>' : '')
      + '<span class="price">' + (sale ? '<span class="pct">' + pct + '%</span>' : '') + '<span>' + won(p.price) + '<span class="won">원</span></span></span>'
      + '</div></div></a>';
  }

  // ---- chips ----
  var chip = '전체';
  var chipDefs = [['전체', function(){ return true; }], ['베스트', function(p){ return p.best; }], ['할인중', function(p){ return p.sale && p.orig_price > p.price; }]]
    .concat(D.categories.map(function(c){ return [c, function(p){ return p.category === c; }]; }));
  var chipsEl = $('chips');
  chipsEl.innerHTML = chipDefs.map(function(d){
    var n = all.filter(d[1]).length;
    var cls = d[0] === '베스트' ? ' best' : d[0] === '할인중' ? ' sale' : '';
    return '<button type="button" class="chip' + cls + '" data-c="' + esc(d[0]) + '" aria-pressed="' + (d[0] === chip) + '">' + esc(d[0]) + (d[0] !== '전체' ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }).join('');
  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if (!b) return;
    chip = b.dataset.c;
    chipsEl.querySelectorAll('.chip').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
    b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    render();
  });

  // ---- search ----
  var qEl = $('q'), box = $('searchBox');
  function match(p, q){
    if (!q) return true;
    var m = q.match(/^#?\s*(\d+)$/);
    if (m) return p.id === parseInt(m[1], 10);
    return p.name.toLowerCase().indexOf(q) > -1 || pad(p.id).indexOf(q) > -1;
  }
  qEl.addEventListener('input', render);
  $('clear').addEventListener('click', function(){ qEl.value = ''; qEl.focus(); render(); });
  $('reset').addEventListener('click', function(){ qEl.value = ''; chip = '전체';
    chipsEl.querySelectorAll('.chip').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.c === '전체'); }); render(); });

  // ---- recent strip (newest 3, always of the full list) ----
  $('recent').innerHTML = all.slice(0, 3).map(function(p){ return card(p, true); }).join('');

  // ---- render ----
  function render(){
    var q = qEl.value.trim().toLowerCase();
    box.classList.toggle('has', !!q);
    var f = chipDefs.filter(function(d){ return d[0] === chip; })[0][1];
    var list = all.filter(function(p){ return f(p) && match(p, q); });
    var filtered = q || chip !== '전체';
    $('recentSec').style.display = filtered ? 'none' : '';
    $('gridTitle').firstChild.textContent = filtered ? (q ? '검색 결과 ' : chip + ' ') : '전체 제품 ';
    $('count').textContent = list.length + '개';
    $('grid').innerHTML = list.map(function(p){ return card(p, false); }).join('');
    $('empty').classList.toggle('on', !list.length);
    $('emptyMsg').textContent = q ? '"' + qEl.value.trim() + '"에 맞는 제품이 없어요. 영상 속 번호를 다시 확인해 주세요.' : '이 카테고리에는 아직 제품이 없어요.';
  }
  render();
})();
</script>
</body>
</html>
