<meta property="og:description" content="퇴근하고 집 오면 또 집안일… 그거 해결해주는 템만 골라요. 영상 번호로 바로 찾는 쿠팡 제품 카탈로그.">

<style>
/* 3초 테스트: 첫눈엔 번호 검색창(핵심), 번호로 찾으면 꽉 찬 쿠팡 버튼(보조). 목록의 쿠팡 버튼·브랜드·필터는 한 단계 낮춘다. */
:root{
  --bg:#FFFFFF;--ink:#111111;--sub:#5F5F5F;--faint:#767676;--line:#ECECEA;--well:#F4F4F2;
  --cta:#D63A0C;--cta-press:#B53009;
  --best-bg:#111111;--best-fg:#FFFFFF;--sale-bg:#FDE9E3;--sale-fg:#A82D08;--out-bg:#E6E6E4;--out-fg:#444444;
  --r:14px;--gut:16px;
  --sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--gut) calc(32px + env(safe-area-inset-bottom))}

/* ===== 헤더: 브랜드 → 고지 (작게, 그러나 항상 보이게) ===== */
.hd{padding:20px 0 12px;display:grid;gap:10px}
.brand-row{display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:8px;flex:none;object-fit:cover}
.brand{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.handle{font-size:13px;color:var(--sub);margin-left:auto;white-space:nowrap}
.handle:hover{color:var(--ink)}
.tag{font-size:13px;color:var(--faint)}
.disc{font-size:12px;line-height:1.5;color:var(--sub);background:var(--well);border-radius:10px;padding:8px 12px}
.disc b{font-weight:700;color:var(--ink);margin-right:6px}

/* ===== 번호 검색: 화면에서 제일 큰 입력, 스크롤해도 위에 붙어 있음 ===== */
.ctl{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin:0 calc(-1 * var(--gut));padding-left:var(--gut);padding-right:var(--gut)}
.ctl.stuck{box-shadow:0 6px 12px -10px rgba(0,0,0,.25)}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--ink);pointer-events:none}
.search input{width:100%;height:54px;border:2px solid var(--ink);border-radius:var(--r);background:var(--bg);font:inherit;font-size:17px;font-weight:500;color:var(--ink);padding:0 84px 0 46px;outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--sub);font-weight:500}
.search input:focus{box-shadow:0 0 0 3px rgba(17,17,17,.12)}
.search input::-webkit-search-cancel-button{display:none}
.search output{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;border-radius:50%;font-size:20px;line-height:1;color:var(--sub);cursor:pointer}
.clear[hidden]{display:none}
.has-q output{right:52px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px;margin:0 calc(-1 * var(--gut));padding-left:var(--gut);padding-right:var(--gut)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 12px;border:0;border-radius:999px;background:none;color:var(--sub);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--well);color:var(--ink);font-weight:700}
:focus-visible{outline:2px solid var(--cta);outline-offset:2px}

/* ===== 카드: 컴포넌트 하나를 규격대로 반복 ===== */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px;padding-top:8px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 20px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.grid:empty{display:none}
.card{display:flex;flex-direction:column;min-width:0}
.fig{position:relative;display:block;aspect-ratio:1/1;border-radius:var(--r);background:var(--well);overflow:hidden}
.fig img{width:100%;height:100%;object-fit:contain;padding:9%;transition:transform .25s ease}
@media(hover:hover){.card:hover .fig img{transform:scale(1.04)}}
.fig .ph{position:absolute;inset:0;display:none;place-items:center;font-size:13px;color:var(--faint)}
.fig.noimg img{display:none}.fig.noimg .ph{display:grid}
.tags{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.t{font-size:12px;font-weight:600;line-height:1;padding:5px 8px;border-radius:999px}
.t.best{background:var(--best-bg);color:var(--best-fg)}
.t.sale{background:var(--sale-bg);color:var(--sale-fg)}
.t.out{background:var(--out-bg);color:var(--out-fg)}
.info{display:flex;flex-direction:column;gap:2px;padding:10px 2px 0;flex:1}
.no{font-size:16px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.no small{font-size:12px;font-weight:500;color:var(--faint);margin-left:6px;letter-spacing:0}
.name{font-size:14px;font-weight:500;line-height:1.4;color:#2A2A2A;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;padding-top:4px;font-variant-numeric:tabular-nums}
.price .off{font-size:16px;font-weight:800;color:var(--cta)}
.price .now{font-size:18px;font-weight:700;letter-spacing:-.02em}
.price .was{font-size:12px;color:var(--faint);text-decoration:line-through;width:100%}
.price{margin-bottom:10px}
.act{display:flex;gap:6px;margin-top:auto}
.cta{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;height:44px;border-radius:12px;background:var(--sale-bg);color:var(--sale-fg);font-size:14px;font-weight:700;white-space:nowrap}
.cta:active{background:#F9D5CA}
.reel{flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:var(--ink);background:none;box-shadow:inset 0 0 0 1.5px #DADAD7}
.reel svg{width:18px;height:18px}
.card.soldout .fig img{opacity:.35}
.card.soldout .name,.card.soldout .price{color:var(--faint)}
.card.soldout .cta{background:var(--out-bg);color:var(--out-fg)}
/* 번호로 딱 1개 찾았을 때: 가로형 큰 카드로 바꿔 버튼까지 첫 화면 안에 */
.grid.hit{grid-template-columns:minmax(0,1fr);max-width:640px}
.hit .card{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:14px;align-items:start}
.hit .info{padding-top:2px}
.hit .no{font-size:20px}
.hit .cta{height:52px;font-size:16px;background:var(--cta);color:#fff}
.hit .cta:active{background:var(--cta-press)}
.hit .reel{width:52px;height:52px}

.empty{padding:48px 8px;text-align:center}
.empty strong{display:block;font-size:18px;font-weight:700;margin-bottom:6px}
.empty p{color:var(--sub);font-size:14px;margin-bottom:16px}
.empty button{height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--ink);background:none;font:inherit;font-weight:600;cursor:pointer}

/* ===== 푸터 ===== */
.ft{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);display:grid;gap:8px;font-size:13px;color:var(--sub)}
.ft a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.ft-links{display:flex;flex-wrap:wrap;gap:4px 16px}

@media(min-width:720px){
  :root{--gut:24px}
  .hd{padding-top:32px;grid-template-columns:1fr auto;align-items:end;column-gap:24px}
  .brand{font-size:22px}
  .logo{width:36px;height:36px;border-radius:10px}
  .brand-row{grid-column:1/-1}
  .disc{grid-column:1/-1}
  .ctl{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:16px;align-items:center}
  .chips{margin:0;padding:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var pad = function(n){ return '#' + String(n).padStart(3,'0'); };
  var won = function(n){ return Number(n).toLocaleString('ko-KR') + '원'; };
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';

  var grid = $('grid'), empty = $('empty'), q = $('q'), count = $('count'), chipsEl = $('chips');
  var products = [], active = 'all';

  function init(D){
    var B = D.brand;
    $('brandName').textContent = B.name;
    $('tagline').textContent = B.tagline;
    $('disclosure').textContent = B.disclosure;
    $('handle').textContent = '@' + B.handle; $('handle').href = B.instagram;
    $('priceNote').textContent = B.price_note;
    $('contact').textContent = B.contact; $('contact').href = 'mailto:' + B.contact;
    $('insta').textContent = '@' + B.handle; $('insta').href = B.instagram;
    $('copy').textContent = '© ' + new Date().getFullYear() + ' ' + B.name;

    products = (D.products || []).filter(function(p){ return p.active !== false; })
      .sort(function(a,b){ return a.added < b.added ? 1 : a.added > b.added ? -1 : b.id - a.id; });

    var filters = [['all','전체'],['best','베스트'],['sale','할인중']].concat((D.categories || []).map(function(c){ return ['cat:'+c, c]; }));
    if (filters.every(function(f){ return f[0] !== active; })) active = 'all';
    chipsEl.innerHTML = '';
    filters.forEach(function(f){
      var b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.dataset.f = f[0]; b.textContent = f[1];
      b.setAttribute('aria-pressed', f[0] === active);
      b.addEventListener('click', function(){ setFilter(f[0]); });
      chipsEl.appendChild(b);
    });
    render();
  }
  function setFilter(f){
    active = f;
    chipsEl.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', c.dataset.f === active); });
    render();
  }

  function numOf(term){ var n = term.replace(/^#/, ''); return /^\d+$/.test(n) ? parseInt(n,10) : null; }
  function matchQ(p, term){
    if (!term) return true;
    var n = numOf(term);
    if (n !== null) return p.id === n;
    return p.name.toLowerCase().indexOf(term.toLowerCase()) !== -1;
  }
  function matchF(p){
    if (active === 'all') return true;
    if (active === 'best') return p.best;
    if (active === 'sale') return p.sale && p.orig_price > p.price;
    return p.category === active.slice(4);
  }

  function card(p){
    var sale = p.sale && p.orig_price > p.price;
    var off = sale ? Math.round((1 - p.price / p.orig_price) * 100) : 0;
    var tags = '';
    if (p.soldout) tags += '<span class="t out">품절</span>';
    if (p.best) tags += '<span class="t best">베스트</span>';
    if (sale) tags += '<span class="t sale">할인</span>';
    var href = esc(p.coupang_url), num = pad(p.id);
    return '<article class="card' + (p.soldout ? ' soldout' : '') + '" data-id="' + p.id + '">' +
      '<a class="fig" href="' + href + '" target="_blank" rel="noopener sponsored" tabindex="-1" aria-hidden="true">' +
        '<img src="' + esc(p.image) + '" alt="" loading="lazy" decoding="async" width="600" height="600" onerror="this.parentNode.classList.add(\'noimg\')">' +
        '<span class="ph">이미지 준비 중</span>' +
        (tags ? '<span class="tags">' + tags + '</span>' : '') +
      '</a>' +
      '<div class="info">' +
        '<span class="no">' + num + '<small>' + esc(p.category) + '</small></span>' +
        '<h2 class="name">' + esc(p.name) + '</h2>' +
        '<span class="price">' + (sale ? '<span class="off">' + off + '%</span>' : '') + '<span class="now">' + won(p.price) + '</span>' +
          (sale ? '<span class="was">' + won(p.orig_price) + '</span>' : '') + '</span>' +
        '<div class="act">' +
          '<a class="cta" href="' + href + '" target="_blank" rel="noopener sponsored" aria-label="' + esc(num + ' ' + p.name + ' 쿠팡에서 보기' + (p.soldout ? ' (품절)' : '')) + '">쿠팡에서 보기</a>' +
          (p.reel_url ? '<a class="reel" href="' + esc(p.reel_url) + '" target="_blank" rel="noopener" aria-label="' + esc(num + ' 영상 보기') + '" title="영상 보기">' + PLAY + '</a>' : '') +
        '</div>' +
      '</div>' +
    '</article>';
  }

  function render(){
    var term = q.value.trim();
    var list = products.filter(function(p){ return matchF(p) && matchQ(p, term); });
    var n = numOf(term);
    if (n !== null && !list.length && active !== 'all') { setFilter('all'); return; }   // 번호 검색은 필터와 무관하게 찾는다
    grid.innerHTML = list.map(card).join('');
    grid.classList.toggle('hit', n !== null && list.length === 1);
    empty.hidden = list.length > 0;
    $('emptyTitle').textContent = n !== null ? pad(n) + ' 제품이 아직 없어요' : '찾는 제품이 없어요';
    $('emptyMsg').textContent = n !== null ? '영상 끝에 나온 번호를 다시 확인해 주세요.' : '다른 이름이나 번호로 찾아보세요.';
    count.textContent = term ? list.length + '개' : '';   // 기본 상태에선 검색창 안 잡음 제거
    $('clear').hidden = !term; $('searchBox').classList.toggle('has-q', !!term);
  }
  q.addEventListener('input', render);
  $('clear').addEventListener('click', function(){ q.value = ''; render(); q.focus(); });
  $('reset').addEventListener('click', function(){ q.value = ''; setFilter('all'); });

  // 검색창이 위에 붙으면 아래 그림자로 경계만 표시
  if ('IntersectionObserver' in window) {
    var s = document.createElement('div'); $('ctl').before(s);
    new IntersectionObserver(function(e){ $('ctl').classList.toggle('stuck', !e[0].isIntersecting); }).observe(s);
  }

  // 1) render inline fallback immediately; 2) replace with live products.json when reachable.
  var inlineText = $('data').textContent, inline = null;
  try { inline = JSON.parse(inlineText); } catch (err) {}
  if (inline && inline.brand) init(inline);
  window.__dataSource = 'inline';
  fetch('products.json?v=' + Date.now(), {cache: 'no-store'})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(D){ window.__dataSource = 'fetch'; if (JSON.stringify(D) !== JSON.stringify(inline)) init(D); })
    .catch(function(){ if (!(inline && inline.brand)) { empty.hidden = false; $('emptyTitle').textContent = '제품을 불러오지 못했어요'; $('emptyMsg').textContent = '잠시 후 새로고침해 주세요.'; } });
})();
</script>
</body>
</html>
